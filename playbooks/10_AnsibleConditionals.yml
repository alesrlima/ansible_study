---

- name: Ansible Conditionals (When)
  hosts: all
  tasks:
    - name: DNF | Update Systems
      ansible.builtin.dnf:
       name: "*"
       state: latest
       update_cache: yes
      when: ansible_distribution == "Fedora"

    - name: APT | Update Cache
      ansible.builtin.apt:
       update_cache: yes
      when: ansible_distribution == "Ubuntu"

    - name: APT | Update Systems
      ansible.builtin.apt:
        name: "*"
        state: yes
      when: ansible_distribution == "Ubuntu"

...
