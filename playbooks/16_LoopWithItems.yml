---

- name: SYSTEM | Copy files
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
  loop:
    - { src: "files/files1.txt", dest: "/tmp/files1.txt" }
    - { src: "files/files2.txt", dest: "/tmp/files2.txt" }
    - { src: "files/files3.txt", dest: "/tmp/files3.txt" }

...
