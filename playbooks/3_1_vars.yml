---
- name: Testando variáveis
  hosts: all
  become: true
  gather_facts: true

  vars:
    message: "Mensagem de teste através de variável"
    packages:
      - htop
      - vim

  tasks:
    - name: DEBUG | Exibir mensagem
      ansible.builtin.debug:
        msg: "{{ message }}"

    - name: DNF | Instalar pacotes no Fedora/RHEL
      ansible.builtin.dnf:
        name: "{{ packages }}"
        state: present
      when: ansible_facts.os_family == "RedHat"

    - name: APT | Instalar pacotes no Ubuntu/Debian
      ansible.builtin.apt:
        name: "{{ packages }}"
        state: present
        update_cache: true
      when: ansible_facts.os_family == "Debian"
