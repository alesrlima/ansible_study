---

- name: Testando variaveis
  hosts: all
  vars_files: /etc/ansible/playbooks/varsfiles.yml
  tasks:
    - name: DNF | Install packages
      ansible.builtin.dnf:
        name: "{{ packages }}"
        state: latest
    
    - name: APT | Install packages
      ansible.builtin.apt:
        name: "{{ packages }}"
        state: latest
...
