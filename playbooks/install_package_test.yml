---
- hosts: all
  become: true

  vars:
    apache_package: apache2
    php_packages:
      - php
      - libapache2-mod-php
      - php-mysql

  tasks:
    - name: Atualizar cache do APT
      ansible.builtin.apt:
        update_cache: true

    - name: Instalar Apache e PHP
      ansible.builtin.apt:
        name: "{{ [apache_package] + php_packages }}"
        state: latest
...
